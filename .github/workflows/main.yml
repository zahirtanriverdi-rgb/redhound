name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Run the built CLI the way users will, and check its exit codes.
      - name: CLI finds the vulnerable fixtures
        run: |
          set +e
          node dist/bin.js scan tests/fixtures --format json > fixtures-report.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected exit code 1 (issues found), got $code"
            exit 1
          fi

      - name: CLI reports its own source as clean
        run: node dist/bin.js scan src
